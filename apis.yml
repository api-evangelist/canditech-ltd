aid: canditech-ltd
name: Canditech Ltd.
description: >-
  Canditech is a skills-assessment and job-simulation platform that helps hiring
  teams evaluate candidates' technical and soft skills before interviewing. The
  product generates role-specific skill assessments with AI, offers a library of
  500+ expert-made tests, and runs job simulations, video interviews, cognitive
  and personality tests, and pre-screening chatbots, backed by anti-cheating
  controls (ChatGPT detection, copy-paste and tab tracking, device and location
  monitoring). Canditech is API-first and integrates with 40+ applicant tracking
  systems (Greenhouse, Lever, Workable, Ashby, SmartRecruiters, Workday, SAP
  SuccessFactors and more), plus WhatsApp, SMS, and Google Sheets. A private
  Enterprise API is available to partners and enterprise customers on request.
  Backed by Insight Partners. This profile is maintained in the API Evangelist
  network.
